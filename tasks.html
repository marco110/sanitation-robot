                                                                <button
                                                                    onClick={() => onLinkMap(file)}
                                                                    title="关联到点云地图"
                                                                    style={{
                                                                        display: 'inline-flex', alignItems: 'center', gap: 4, padding: '5px 10px', borderRadius: 6,
                                                                        fontSize: 11, fontWeight: 500, fontFamily: 'Noto Sans SC, sans-serif', cursor: 'pointer',
                                                                        background: 'rgba(147,51,234,0.1)', border: '1px solid rgba(147,51,234,0.35)',
                                                                        color: '#c084fc', transition: 'all 0.15s', whiteSpace: 'nowrap',
                                                                    }}
                                                                >
                                                                    <svg width="11" height="11" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                                                                        <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" />
                                                                        <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" />
                                                                    </svg>
                                                                    关联
                                                                </button>
                                                            )}
                                                            <button
                                                            onClick={() => handleDownload(file)}
                                                            disabled={downloadingId === file.id}
                                                            style={{
                                                                display: 'inline-flex', alignItems: 'center', gap: 4, padding: '5px 12px', borderRadius: 6,
                                                                fontSize: 11, fontWeight: 500, fontFamily: 'Noto Sans SC, sans-serif', cursor: 'pointer',
                                                                background: downloadingId === file.id ? 'rgba(0,255,136,0.15)' : 'rgba(0,255,136,0.08)',
                                                                border: '1px solid ' + (downloadingId === file.id ? 'rgba(0,255,136,0.5)' : 'rgba(0,255,136,0.25)'),
                                                                color: downloadingId === file.id ? '#00FF88' : '#00FF88',
                                                                transition: 'all 0.15s',
                                                            }}
                                                        >
                                                            <svg width="12" height="12" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                                                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                                                                <polyline points="7 10 12 15 17 10" />
                                                                <line x1="12" y1="15" x2="12" y2="3" />
                                                            </svg>
                                                            {downloadingId === file.id ? '下载中...' : '下载'}
                                                        </button>
                                                        </div>
                                                    </td>
                                                </tr>
                                            );
                                        })}
                                    </tbody>
                                </table>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        // ─── Map Link Modal (关联地图采集到点云地图) ──────────────────────────────────

        function MapLinkModal({ file, mapRegions, mapData, onClose, onSave }) {
            const [regionName, setRegionName] = useState('');
            const [newRegionName, setNewRegionName] = useState('');
            const [version, setVersion] = useState('');
            const [desc, setDesc] = useState(file ? file.desc : '');
            const [saving, setSaving] = useState(false);

            const existingRegions = Object.keys(mapData);
            const selectedRegion = regionName === '__new__' ? null : mapData[regionName];
            const isNewRegion = regionName === '__new__';

            // Auto-generate next version for selected region
            React.useEffect(() => {
                if (selectedRegion && selectedRegion.lidar && selectedRegion.lidar.length > 0) {
                    const versions = selectedRegion.lidar.map(v => v.version).sort().reverse();
                    const latestVer = versions[0];
                    const parts = latestVer.split('.');
                    const nextPatch = parseInt(parts[2] || '0') + 1;
                    setVersion(`${parts[0]}.${parts[1]}.${nextPatch}`);
                } else {
                    setVersion('');
                }
            }, [regionName, mapData]);

            const handleSave = async () => {
                const finalRegion = isNewRegion ? newRegionName.trim() : regionName;
                if (!finalRegion) { alert('请选择或输入地区名称'); return; }
                if (!version.trim()) { alert('请输入版本号'); return; }
                if (isNewRegion && existingRegions.includes(finalRegion)) { alert('该地区已存在，请从下拉列表中选择'); return; }

                setSaving(true);
                await new Promise(r => setTimeout(r, 1500));

                onSave({
                    regionName: finalRegion,
                    version: version.trim(),
                    desc: desc.trim(),
                    fileSize: file.size,
                    uploadTime: new Date().toISOString().slice(0, 16).replace('T', ' '),
                    uploader: '李运营',
                    isNewRegion,
                    sourceFile: file,
                });
                setSaving(false);
                onClose();
            };

            const now = new Date();
            const pad = n => String(n).padStart(2, '0');
            const timestamp = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}`;

            return (
                <div className="fixed inset-0 modal-overlay flex items-center justify-center z-[60] p-4" onClick={onClose}>
                    <div className="modal-box modal-animate w-full" style={{ maxWidth: 560, maxHeight: '90vh', display: 'flex', flexDirection: 'column' }} onClick={e => e.stopPropagation()}>
                        {/* Header */}
                        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '18px 20px 0', flexShrink: 0 }}>
                            <div>
                                <h3 style={{ fontSize: 15, fontWeight: 600, color: '#e2e8f0', fontFamily: 'Noto Sans SC, sans-serif' }}>关联到点云地图</h3>
                                <p style={{ fontSize: 11, color: '#64748b', marginTop: 2, fontFamily: 'Noto Sans SC, sans-serif' }}>将地图采集数据作为点云地图版本进行管理</p>
                            </div>
                            <button onClick={onClose} style={{ background: 'transparent', border: 'none', color: '#64748b', cursor: 'pointer', padding: 4 }} className="hover:text-white">
                                <IconX />
                            </button>
                        </div>
                        <div className="glow-line" style={{ margin: '14px 20px 0', flexShrink: 0 }} />

                        <div style={{ padding: '16px 20px 20px', fontFamily: 'Noto Sans SC, sans-serif', overflowY: 'auto', flex: 1 }}>
                            {/* Source file info */}
                            <div style={{
                                background: 'rgba(0,212,255,0.05)', border: '1px solid rgba(0,212,255,0.15)', borderRadius: 10,
                                padding: '12px 14px', marginBottom: 16,
                            }}>
                                <div style={{ fontSize: 10, color: '#475569', marginBottom: 6, textTransform: 'uppercase', letterSpacing: '0.05em', fontFamily: 'Inter, sans-serif' }}>源文件信息</div>
                                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '6px 12px' }}>
                                    {[
                                        ['文件描述', file.desc],
                                        ['上传时间', file.uploadTime],
                                        ['采集时长', file.duration],
                                        ['文件大小', file.size],
                                    ].map(([k, v]) => (
                                        <div key={k} style={{ display: 'flex', gap: 6, alignItems: 'baseline' }}>
                                            <span style={{ fontSize: 10, color: '#475569', whiteSpace: 'nowrap' }}>{k}:</span>
                                            <span style={{ fontSize: 11, color: '#94a3b8', fontFamily: 'Inter, sans-serif' }}>{v}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            {/* Region selection */}
                            <div style={{ marginBottom: 14 }}>
                                <label style={{ display: 'block', fontSize: 12, color: '#94a3b8', marginBottom: 6, fontFamily: 'Noto Sans SC, sans-serif' }}>
                                    目标地区 <span style={{ color: '#ef4444' }}>*</span>
                                </label>
                                <select value={regionName} onChange={e => setRegionName(e.target.value)}
                                    style={{
                                        width: '100%', padding: '9px 12px', borderRadius: 8, fontSize: 12,
                                        background: '#080f1e', border: '1px solid #1a3350', color: '#e2e8f0',
                                        fontFamily: 'Noto Sans SC, sans-serif', outline: 'none', cursor: 'pointer',
                                    }}>
                                    <option value="">请选择地区</option>
                                    {existingRegions.map(r => (
                                        <option key={r} value={r}>{r}（现有 {mapData[r].lidar.length} 个版本）</option>
                                    ))}
                                    <option value="__new__">+ 新增地区</option>
                                </select>
                                {isNewRegion && (
                                    <input
                                        type="text" value={newRegionName} onChange={e => setNewRegionName(e.target.value)}
                                        placeholder="输入新地区名称" autoFocus
                                        style={{
                                            width: '100%', marginTop: 8, padding: '9px 12px', borderRadius: 8, fontSize: 12,
                                            background: '#080f1e', border: '1px solid #1a3350', color: '#e2e8f0',
                                            fontFamily: 'Noto Sans SC, sans-serif', outline: 'none',
                                            boxSizing: 'border-box',
                                        }}
                                    />
                                )}
                            </div>

                            {/* Existing versions preview */}
                            {selectedRegion && selectedRegion.lidar && selectedRegion.lidar.length > 0 && (
                                <div style={{
                                    background: '#080f1e', border: '1px solid #1a3350', borderRadius: 8,
                                    padding: '10px 12px', marginBottom: 14,

                                    <div style={{ fontSize: 10, color: '#475569', marginBottom: 6, fontFamily: 'Inter, sans-serif' }}>现有版本</div>

                                        <div key={v.id} style={{
                                            display: 'flex', alignItems: 'center', justifyContent: 'space-between',
                                            padding: '4px 0', borderBottom: i < selectedRegion.lidar.length - 1 ? '1px solid #0f1a2a' : 'none',
                                        }}>
                                            <span style={{ fontSize: 11, fontFamily: 'Inter, sans-serif' }}>
                                                <span style={{ color: '#00D4FF', fontWeight: 600 }}>v{v.version}</span>
                                                <span style={{ color: '#475569', marginLeft: 8 }}>{v.uploadTime}</span>
                                            </span>
                                            {v.isActive && (
                                                <span style={{ fontSize: 9, padding: '1px 6px', borderRadius: 9999, background: 'rgba(0,255,136,0.1)', color: '#00FF88', fontFamily: 'Inter, sans-serif', border: '1px solid rgba(0,255,136,0.2)' }}>当前</span>
                                            )}
                                        </div>
                                    ))}
                                    <div style={{ fontSize: 10, color: '#00D4FF', marginTop: 6, fontFamily: 'Inter, sans-serif' }}>
                                        → 新版本号已自动生成: <span style={{ fontWeight: 700 }}>v{version}</span>
                                    </div>
                                </div>
                            )}

                            {/* Version */}
                            <div style={{ marginBottom: 14 }}>
                                <label style={{ display: 'block', fontSize: 12, color: '#94a3b8', marginBottom: 6, fontFamily: 'Noto Sans SC, sans-serif' }}>
                                    版本号 <span style={{ color: '#ef4444' }}>*</span>
                                </label>
                                <input
                                    type="text" value={version} onChange={e => setVersion(e.target.value)}
                                    placeholder={isNewRegion ? '输入版本号，如 1.0.0' : '自动生成或手动输入'}
                                    style={{
                                        width: '100%', padding: '9px 12px', borderRadius: 8, fontSize: 12,
                                        background: '#080f1e', border: '1px solid #1a3350', color: '#e2e8f0',
                                        fontFamily: 'Inter, sans-serif', outline: 'none',
                                        boxSizing: 'border-box',
                                    }}
                                />
                            </div>

                            {/* Description */}
                            <div style={{ marginBottom: 14 }}>
                                <label style={{ display: 'block', fontSize: 12, color: '#94a3b8', marginBottom: 6, fontFamily: 'Noto Sans SC, sans-serif' }}>
                                    版本描述
                                </label>
                                <textarea
                                    value={desc} onChange={e => setDesc(e.target.value)}
                                    placeholder="描述本次地图采集的变更内容" rows={3}
                                    style={{
                                        width: '100%', padding: '9px 12px', borderRadius: 8, fontSize: 12,
                                        background: '#080f1e', border: '1px solid #1a3350', color: '#e2e8f0',
                                        fontFamily: 'Noto Sans SC, sans-serif', outline: 'none', resize: 'vertical',
                                        boxSizing: 'border-box',
                                    }}
                                />
                            </div>

                            {/* Preview */}
                            <div style={{
                                background: 'rgba(0,212,255,0.03)', border: '1px solid rgba(0,212,255,0.1)', borderRadius: 8,
                                padding: '10px 12px', marginBottom: 16,
                            }}>
                                <div style={{ fontSize: 10, color: '#475569', marginBottom: 6, fontFamily: 'Inter, sans-serif', textTransform: 'uppercase' }}>新版本预览</div>
                                <div style={{ fontSize: 11, color: '#94a3b8', lineHeight: '20px', fontFamily: 'Inter, sans-serif' }}>
                                    <div>地区: <span style={{ color: '#00D4FF' }}>{isNewRegion ? (newRegionName || '—') : (regionName || '—')}</span></div>
                                    <div>版本: <span style={{ color: '#00FF88' }}>v{version || '—'}</span></div>
                                    <div>大小: <span style={{ color: '#f59e0b' }}>{file.size}</span></div>
                                    <div>时间: <span style={{ color: '#64748b' }}>{timestamp}</span></div>
                                </div>
                            </div>

                            {/* Actions */}
                            <div style={{ display: 'flex', gap: 8, justifyContent: 'flex-end' }}>
                                <button onClick={onClose}
                                    style={{
                                        padding: '8px 18px', borderRadius: 8, fontSize: 12, fontFamily: 'Noto Sans SC, sans-serif',

                                                                            onMouseLeave={e => { e.currentTarget.style.borderColor = '#1a3350'; e.currentTarget.style.color = '#64748b'; }}>

                                                                {wp.label || `途经点 ${i + 1}`}

                                                    </div>

                                            <input type="date" className="input-base" value={searchDateStart} onChange={e => setSearchDateStart(e.target.value)} style={{ fontSize: 11, padding: '7px 8px' }} />
                                            <span style={{ color: '#475569', fontSize: 11 }}>至</span>
                                            <input type="date" className="input-base" value={searchDateEnd} onChange={e => setSearchDateEnd(e.target.value)} style={{ fontSize: 11, padding: '7px 8px' }} />

                                    </div>
                                    <div>
                                        <label style={{ fontSize: 11, color: '#475569', display: 'block', marginBottom: 4, fontFamily: 'Noto Sans SC, sans-serif' }}>作业车辆</label>

                                    <div>
                                        <label style={{ fontSize: 11, color: '#475569', display: 'block', marginBottom: 4, fontFamily: 'Noto Sans SC, sans-serif' }}>工作模式</label>

                                        </select>
                                    </div>
                                </div>
                            </div>

                            <div style={{ background: 'linear-gradient(135deg, #0d1a2e 0%, #0a1220 100%)', border: '1px solid #1a3350', borderRadius: 12, overflow: 'hidden' }}>
                                <div style={{ overflowX: 'auto' }}>
                                    <table style={{ width: '100%', borderCollapse: 'collapse', fontFamily: 'Noto Sans SC, sans-serif', tableLayout: 'fixed' }}>
                                        <colgroup>
                                            <col style={{ width: '75px' }} />
                                            <col style={{ width: '100px' }} />
                                            <col style={{ width: '70px' }} />
                                            <col style={{ width: '70px' }} />
                                            <col style={{ width: '70px' }} />
                                            <col style={{ width: '60px' }} />
                                            <col style={{ width: '85px' }} />
                                            <col style={{ width: '70px' }} />
                                            <col style={{ width: '70px' }} />
                                            <col style={{ width: '72px' }} />
                                            <col style={{ width: '100px' }} />
                                            <col style={{ width: '100px' }} />
                                        </colgroup>
                                        <thead>
                                            <tr style={{ background: 'rgba(0,212,255,0.04)', borderBottom: '1px solid #1a3350' }}>
                                                <th style={{ padding: '10px 8px', textAlign: 'center', fontSize: 11, fontWeight: 600, color: '#94a3b8', fontFamily: 'Inter, sans-serif', whiteSpace: 'nowrap' }}>作业状态</th>
                                                <th style={{ padding: '10px 8px', textAlign: 'left', fontSize: 11, fontWeight: 600, color: '#94a3b8', fontFamily: 'Inter, sans-serif', whiteSpace: 'nowrap' }}>作业名称</th>
                                                <th style={{ padding: '10px 8px', textAlign: 'left', fontSize: 11, fontWeight: 600, color: '#94a3b8', fontFamily: 'Inter, sans-serif', whiteSpace: 'nowrap' }}>工作模式</th>
                                                <th style={{ padding: '10px 8px', textAlign: 'left', fontSize: 11, fontWeight: 600, color: '#94a3b8', fontFamily: 'Inter, sans-serif', whiteSpace: 'nowrap' }}>作业车辆</th>
                                                <th style={{ padding: '10px 8px', textAlign: 'left', fontSize: 11, fontWeight: 600, color: '#94a3b8', fontFamily: 'Inter, sans-serif', whiteSpace: 'nowrap' }}>作业路线</th>
                                                <th style={{ padding: '10px 8px', textAlign: 'center', fontSize: 11, fontWeight: 600, color: '#94a3b8', fontFamily: 'Inter, sans-serif', whiteSpace: 'nowrap' }}>清扫次数</th>
                                                <th style={{ padding: '10px 8px', textAlign: 'left', fontSize: 11, fontWeight: 600, color: '#94a3b8', fontFamily: 'Inter, sans-serif', whiteSpace: 'nowrap' }}>作业模式</th>
                                                <th style={{ padding: '10px 8px', textAlign: 'left', fontSize: 11, fontWeight: 600, color: '#94a3b8', fontFamily: 'Inter, sans-serif', whiteSpace: 'nowrap' }}>开始时间</th>
                                                <th style={{ padding: '10px 8px', textAlign: 'left', fontSize: 11, fontWeight: 600, color: '#94a3b8', fontFamily: 'Inter, sans-serif', whiteSpace: 'nowrap' }}>结束时间</th>
                                                <th style={{ padding: '10px 8px', textAlign: 'center', fontSize: 11, fontWeight: 600, color: '#94a3b8', fontFamily: 'Inter, sans-serif', whiteSpace: 'nowrap' }}>已耗时</th>
                                                <th style={{ padding: '10px 8px', textAlign: 'center', fontSize: 11, fontWeight: 600, color: '#94a3b8', fontFamily: 'Inter, sans-serif', whiteSpace: 'nowrap' }}>进度</th>

                                            </tr>
                                        </thead>

                                                    if (filter === '已完成') return t.progress === 100;
                                                    if (filter === '待开始') return t.progress === 0;
                                                    if (filter === '未完成') return t.progress > 0 && t.progress < 100 && t.endTime !== '-';
                                                    if (filter !== '全部') return t.status === filter;
                                                    return true;
                                                })
                                                .filter(t => !searchName || t.name.toLowerCase().includes(searchName.toLowerCase()))
                                                .filter(t => {
                                                    if (!searchDateStart && !searchDateEnd) return true;
                                                    if (t.startTime === '-') return false;
                                                    const taskDate = t.startTime.split(' ')[0];
                                                    if (searchDateStart && searchDateEnd) {
                                                        return taskDate >= searchDateStart && taskDate <= searchDateEnd;
                                                    } else if (searchDateStart) {
                                                        return taskDate >= searchDateStart;
                                                    } else if (searchDateEnd) {
                                                        return taskDate <= searchDateEnd;
                                                    }
                                                    return true;
                                                })
                                                .filter(t => !searchVehicle || t.vehicle === searchVehicle)
                                                .filter(t => !searchMode || t.mode === searchMode)
                                                .filter(t => !searchRoute || (t.routes && t.routes.some(r => r.name === searchRoute)))
                                                .map((task, idx) => {
                                                    const sc = statusConfig[task.status] || statusConfig['已完成'];
                                                    const mc = modeColorMap[task.mode] || '#64748b';
                                                    return (
                                                        <tr key={task.id} style={{ borderBottom: idx < tasks.length - 1 ? '1px solid #1a3350' : 'none', transition: 'background 0.15s' }}

                                                                {task.progress === 100 ? (

                                                                        <span style={{ width: 5, height: 5, borderRadius: '50%', background: '#00FF88', flexShrink: 0 }}></span>
                                                                        已完成
                                                                    </span>
                                                                ) : task.progress === 0 ? (
                                                                    <span style={{ fontSize: 10, padding: '2px 6px', borderRadius: 4, background: 'rgba(156,163,175,0.12)', color: '#9ca3af', border: '1px solid rgba(156,163,175,0.3)', fontWeight: 500, display: 'inline-flex', alignItems: 'center', gap: 3, whiteSpace: 'nowrap' }}>
                                                                        <span style={{ width: 5, height: 5, borderRadius: '50%', background: '#9ca3af', flexShrink: 0 }}></span>
                                                                        待开始
                                                                    </span>
                                                                ) : task.progress > 0 && task.progress < 100 && task.endTime !== '-' ? (
                                                                    <span style={{ fontSize: 10, padding: '2px 6px', borderRadius: 4, background: 'rgba(251,146,60,0.12)', color: '#fb9224', border: '1px solid rgba(251,146,60,0.3)', fontWeight: 500, display: 'inline-flex', alignItems: 'center', gap: 3, whiteSpace: 'nowrap' }}>
                                                                        <span style={{ width: 5, height: 5, borderRadius: '50%', background: '#fb9224', flexShrink: 0 }}></span>
                                                                        未完成
                                                                    </span>
                                                                ) : (
                                                                    <span style={{ fontSize: 10, padding: '2px 6px', borderRadius: 4, background: 'rgba(0,212,255,0.12)', color: '#00D4FF', border: '1px solid rgba(0,212,255,0.3)', fontWeight: 500, display: 'inline-flex', alignItems: 'center', gap: 3, whiteSpace: 'nowrap' }}>
                                                                        <span style={{ width: 5, height: 5, borderRadius: '50%', background: '#00D4FF', animation: 'pulse 2s infinite', flexShrink: 0 }}></span>
                                                                        作业中
                                                                    </span>
                                                                )}
                                                            </td>
                                                            <td style={{ padding: '10px 8px', verticalAlign: 'middle', overflow: 'hidden' }}>
                                                                <div style={{ fontSize: 12, fontWeight: 600, color: '#e2e8f0', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis', textDecoration: 'underline', textUnderlineOffset: 2, cursor: 'pointer' }} onClick={() => window.location.href = 'monitoring.html?vehicle=' + encodeURIComponent(task.vehicle)}>{task.name}</div>
                                                                {task.modeSubs && task.modeSubs !== '-' && <div style={{ fontSize: 10, color: '#475569', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{task.modeSubs}</div>}
                                                            </td>
                                                            <td style={{ padding: '10px 8px', verticalAlign: 'middle' }}>
                                                                <span style={{ fontSize: 10, padding: '2px 6px', borderRadius: 4, background: `${mc}15`, color: mc, border: `1px solid ${mc}35`, fontWeight: 500, whiteSpace: 'nowrap' }}>{task.mode}</span>
                                                            </td>
                                                            <td style={{ padding: '10px 8px', fontSize: 11, color: '#94a3b8', verticalAlign: 'middle', whiteSpace: 'nowrap' }}>{task.vehicle}</td>
                                                            <td style={{ padding: '10px 8px', verticalAlign: 'middle' }}>
                                                                {task.routes && task.routes.length > 0 ? (
                                                                    <div style={{ display: 'flex', flexWrap: 'wrap', gap: 3 }}>
                                                                        {task.routes.map((r, ri) => (
                                                                            <span key={ri} style={{ fontSize: 10, padding: '2px 6px', borderRadius: 4, background: `${r.color}15`, color: r.color, border: `1px solid ${r.color}35`, whiteSpace: 'nowrap' }}>
                                                                                {r.name}
                                                                            </span>
                                                                        ))}
                                                                    </div>
                                                                ) : (
                                                                    <span style={{ fontSize: 11, color: '#334155' }}>-</span>
                                                                )}
                                                            </td>
                                                            <td style={{ padding: '10px 8px', textAlign: 'center', fontSize: 11, color: '#94a3b8', verticalAlign: 'middle', whiteSpace: 'nowrap' }}>{task.sweepCount}次</td>

                                                            <td style={{ padding: '10px 8px', verticalAlign: 'middle' }}>
                                                                {task.status === '增强作业' ? (
                                                                    <span style={{
                                                                        fontSize: 10,
                                                                        padding: '2px 6px',
                                                                        borderRadius: 4,
                                                                        background: 'rgba(251,191,36,0.15)',
                                                                        color: '#fbbf24',
                                                                        border: '1px solid #fbbf24',
                                                                        fontWeight: 500,
                                                                        whiteSpace: 'nowrap',
                                                                        boxShadow: '0 0 8px rgba(251,191,36,0.3)'
                                                                    }}>
                                                                        {task.status}
                                                                    </span>
                                                                ) : (
                                                                    <span style={{ fontSize: 10, padding: '2px 6px', borderRadius: 4, background: sc.color.split(' ')[1], color: sc.color.split(' ')[0], border: '1px solid', whiteSpace: 'nowrap' }}>
                                                                        {task.status}
                                                                    </span>
                                                                )}
                                                            </td>
                                                            <td style={{ padding: '10px 8px', fontSize: 11, color: '#94a3b8', fontFamily: 'Inter, sans-serif', verticalAlign: 'middle', whiteSpace: 'nowrap' }}>
                                                                {task.startTime === '-' ? '-' : (
                                                                    <div style={{ lineHeight: '18px' }}>
                                                                        <div style={{ color: '#64748b', fontSize: 10 }}>{task.startTime.split(' ')[0]}</div>
                                                                        <div style={{ color: '#94a3b8', fontSize: 12, fontWeight: 500 }}>{task.startTime.split(' ')[1]}</div>
                                                                    </div>
                                                                )}
                                                            </td>
                                                            <td style={{ padding: '10px 8px', fontSize: 11, color: '#94a3b8', fontFamily: 'Inter, sans-serif', verticalAlign: 'middle', whiteSpace: 'nowrap' }}>
                                                                {task.endTime === '-' ? '-' : (
                                                                    <div style={{ lineHeight: '18px' }}>
                                                                        <div style={{ color: '#64748b', fontSize: 10 }}>{task.endTime.split(' ')[0]}</div>
                                                                        <div style={{ color: '#94a3b8', fontSize: 12, fontWeight: 500 }}>{task.endTime.split(' ')[1]}</div>
                                                                    </div>
                                                                )}
                                                            </td>
                                                            <td style={{ padding: '10px 8px', textAlign: 'center', fontSize: 11, fontFamily: 'Inter, sans-serif', color: '#f59e0b', fontWeight: 600, verticalAlign: 'middle', whiteSpace: 'nowrap' }}>
                                                                {task.duration}
                                                            </td>
                                                            <td style={{ padding: '10px 8px', textAlign: 'center', verticalAlign: 'middle' }}>
                                                                <div style={{ display: 'flex', alignItems: 'center', gap: 6, justifyContent: 'center' }}>
                                                                    <div style={{ width: 50, height: 3, background: '#1a3350', borderRadius: 2, overflow: 'hidden', flexShrink: 0 }}>
                                                                        <div style={{ width: task.progress + '%', height: '100%', background: task.progress === 100 ? '#00FF88' : 'linear-gradient(90deg, #00D4FF, #00FF88)', borderRadius: 2, transition: 'width 0.3s' }}></div>
                                                                    </div>
                                                                    <span style={{ fontSize: 10, color: task.progress === 100 ? '#00FF88' : '#00D4FF', fontWeight: 600, whiteSpace: 'nowrap' }}>{task.progress}%</span>
                                                                </div>
                                                            </td>
                                                            <td style={{ padding: '10px 8px', textAlign: 'center', verticalAlign: 'middle' }}>
                                                                <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 4 }}>
                                                                    <button onClick={() => window.location.href = 'monitoring.html?vehicle=' + encodeURIComponent(task.vehicle)} title="查看详情" style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', width: 26, height: 26, borderRadius: 5, background: 'rgba(0,212,255,0.1)', border: '1px solid rgba(0,212,255,0.3)', color: '#00D4FF', cursor: 'pointer', transition: 'all 0.15s' }} onMouseEnter={e => { e.currentTarget.style.background = 'rgba(0,212,255,0.2)'; }} onMouseLeave={e => { e.currentTarget.style.background = 'rgba(0,212,255,0.1)'; }}>
                                                                        <svg width="12" height="12" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>
                                                                    </button>
                                                                    {(task.progress === 100 || (task.endTime !== '-' && task.progress < 100)) && (
                                                                        <button onClick={() => { setShowNewTask(true); setRepeatTaskData(task); }} title="再次作业" style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', width: 26, height: 26, borderRadius: 5, background: 'rgba(139,92,246,0.1)', border: '1px solid rgba(139,92,246,0.3)', color: '#a855f7', cursor: 'pointer', transition: 'all 0.15s' }} onMouseEnter={e => { e.currentTarget.style.background = 'rgba(139,92,246,0.2)'; }} onMouseLeave={e => { e.currentTarget.style.background = 'rgba(139,92,246,0.1)'; }}>
                                                                            <svg width="12" height="12" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>
                                                                        </button>
                                                                    )}
                                                                    <button onClick={() => { const files = getAnomalyFilesForVehicle(task.vehicle); setSelectedTaskAnomalyFiles({ files, vehicle: task.vehicle }); setShowFileModal(true); }} title="异常文件" style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', width: 26, height: 26, borderRadius: 5, background: 'rgba(245,158,11,0.1)', border: '1px solid rgba(245,158,11,0.3)', color: '#f59e0b', cursor: 'pointer', transition: 'all 0.15s' }} onMouseEnter={e => { e.currentTarget.style.background = 'rgba(245,158,11,0.2)'; }} onMouseLeave={e => { e.currentTarget.style.background = 'rgba(245,158,11,0.1)'; }}>
                                                                        <svg width="12" height="12" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z" /><polyline points="14 2 14 8 20 8" /><line x1="16" y1="13" x2="8" y2="13" /><line x1="16" y1="17" x2="8" y2="17" /><polyline points="10 9 9 9 8 9" /></svg>
                                                                    </button>
                                                                    {task.endTime !== '-' && (
                                                                        <button onClick={() => { if (confirm('确定要删除作业「' + task.name + '」吗？')) { setTasks(prev => prev.filter(t => t.id !== task.id)); } }} title="删除" style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', width: 26, height: 26, borderRadius: 5, background: 'rgba(239,68,68,0.1)', border: '1px solid rgba(239,68,68,0.3)', color: '#ef4444', cursor: 'pointer', transition: 'all 0.15s' }} onMouseEnter={e => { e.currentTarget.style.background = 'rgba(239,68,68,0.2)'; }} onMouseLeave={e => { e.currentTarget.style.background = 'rgba(239,68,68,0.1)'; }}>
                                                                            <svg width="12" height="12" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                                                                        </button>
                                                                    )}
                                                                </div>
                                                            </td>
                                                        </tr>
                                                    );
                                                })}
                                        </tbody>
                                    </table>
                                    {tasks.filter(t => {
                                        if (filter === '已完成') return t.progress === 100;
                                        if (filter === '待开始') return t.progress === 0;
                                        if (filter === '未完成') return t.progress > 0 && t.progress < 100 && t.endTime !== '-';
                                        if (filter !== '全部') return t.status === filter;
                                        return true;
                                    }).filter(t => !searchName || t.name.toLowerCase().includes(searchName.toLowerCase()))
                                        .filter(t => {
                                            if (!searchDateStart && !searchDateEnd) return true;
                                            if (t.startTime === '-') return false;
                                            const taskDate = t.startTime.split(' ')[0];
                                            if (searchDateStart && searchDateEnd) {
                                                return taskDate >= searchDateStart && taskDate <= searchDateEnd;
                                            } else if (searchDateStart) {
                                                return taskDate >= searchDateStart;
                                            } else if (searchDateEnd) {
                                                return taskDate <= searchDateEnd;
                                            }
                                            return true;
                                        })
                                        .filter(t => !searchVehicle || t.vehicle === searchVehicle)
                                        .filter(t => !searchMode || t.mode === searchMode)
                                        .filter(t => !searchRoute || (t.routes && t.routes.some(r => r.name === searchRoute))).length === 0 && (
                                            <div style={{ padding: '40px 0', textAlign: 'center', color: '#334155', fontSize: 13 }}>
                                                未找到匹配的作业记录
                                            </div>
                                        )}
                                </div>
                            </div>
                        </div>
                    </div>

                    {showNewTask && (
                        <NewTaskModal
                            onClose={() => { setShowNewTask(false); setRepeatTaskData(null); }}
                            onCreate={createTask}
                            routes={routes}
                            onOpenMap={() => { setShowNewTask(false); setShowRouteBuilder(true); }}
                            repeatData={repeatTaskData}
                        />
                    )}
                    {showRouteBuilder && (
                        <RouteBuilderMap
                            onSave={handleRouteSaved}
                            onClose={() => { setShowRouteBuilder(false); setEditingRouteData(null); }}
                            initialRoute={editingRouteData}
                        />
                    )}
                    {showFileModal && selectedTaskAnomalyFiles && (
                        <FileModal
                            files={selectedTaskAnomalyFiles.files}
                            vehicle={selectedTaskAnomalyFiles.vehicle}
                            mapRegions={Object.keys(mapData)}
                            onLinkMap={handleMapLinkOpen}
                            onClose={() => { setShowFileModal(false); setSelectedTaskAnomalyFiles(null); }}
                        />
                    )}
                    {showMapLinkModal && selectedMapLinkFile && (
                        <MapLinkModal
                            file={selectedMapLinkFile}
                            mapRegions={Object.keys(mapData)}
                            mapData={mapData}
                            onClose={() => { setShowMapLinkModal(false); setSelectedMapLinkFile(null); }}
                            onSave={handleMapLinkSave}
                        />
                    )}
                </div>
            );
        }
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>

</html>
